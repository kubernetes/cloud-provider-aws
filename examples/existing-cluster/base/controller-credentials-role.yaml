---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: system:cloud-controller-manager:controller-credentials
  namespace: kube-system
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  resourceNames:
  - node-controller
  - service-controller
  - route-controller
  - aws-cloud-provider
  - tagging-controller
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  resourceNames:
  - node-controller
  - service-controller
  - route-controller
  - aws-cloud-provider
  - tagging-controller
  verbs:
  - create
